services:
  sukebei-manager:
    build: .
    image: sukebei-manager:latest
    container_name: sukebei-manager
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-Asia/Shanghai}
      SUKEBEI_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SUKEBEI_PORT: 8080
      SUKEBEI_QBITTORRENT_URL: ${QBITTORRENT_URL:-http://10.10.0.213:8080}
      SUKEBEI_QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
      SUKEBEI_QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
      SUKEBEI_QBITTORRENT_SAVE_PATH: ${QBITTORRENT_SAVE_PATH:-/downloads/18x}
    volumes:
      - ./data/config:/config
      - ./data/downloads:/downloads
      - ./data/library:/library
    healthcheck:
      test: ["CMD-SHELL", "gosu \"$${PUID:-99}:$${PGID:-100}\" python -c \"import json, os, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('SUKEBEI_PORT', '8080') + '/api/health', timeout=3)); raise SystemExit(0 if data.get('ok') and data.get('downloader') else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

